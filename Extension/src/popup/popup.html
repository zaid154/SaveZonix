<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Helper</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="brand">
            <img src="../../icons/icon48.png" alt="" class="logo">
            <span class="app-name">Stream Helper</span>
        </div>
        <div class="header-actions">
            <button id="btnRefresh" class="icon-btn" title="Refresh">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
            </button>
            <button id="btnSettingsToggle" class="icon-btn" title="Settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Settings Panel -->
    <div id="settingsPanel" class="settings-panel hidden">
        <div class="settings-header">
            <span>Settings</span>
            <button id="btnCloseSettings" class="close-btn">&times;</button>
        </div>
        <div class="form-group">
            <label for="settingQuality">Default Quality</label>
            <select id="settingQuality" class="select-box">
                <option value="best">Highest (Auto)</option>
                <option value="1080p">1080p Full HD</option>
                <option value="720p">720p HD</option>
                <option value="480p">480p SD</option>
            </select>
        </div>
        <div class="form-group">
            <label for="settingThreads">Download Threads</label>
            <select id="settingThreads" class="select-box">
                <option value="8">8 Threads (Standard)</option>
                <option value="16">16 Threads (Fast)</option>
                <option value="32">32 Threads (Turbo)</option>
                <option value="64" selected>64 Threads (Extreme Max — Recommended)</option>
                <option value="128">128 Threads (Ultra Fiber)</option>
                <option value="256">256 Threads (Hyper Max)</option>
            </select>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="settingRemember" checked>
            <label for="settingRemember">Remember quality</label>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="settingAutoEpisode" checked>
            <label for="settingAutoEpisode">Format series title</label>
        </div>
        <button id="btnSaveSettings" class="btn btn-primary btn-full">Save</button>
    </div>

    <!-- Main -->
    <main class="main">
        <div class="status-line">
            <span class="dot"></span>
            <span id="statusLabel" class="status-text">Scanning for media...</span>
        </div>

        <div id="videoList" class="video-list">
            <!-- Injected via popup.js -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state hidden">
            <span class="empty-title">No media found</span>
            <span class="empty-desc">Play a video in the active tab to detect streams.</span>
        </div>

        <!-- Downloads History -->
        <div id="completedSection" class="history-section hidden">
            <div class="history-header">Recent Downloads</div>
            <div id="completedList" class="history-list"></div>
        </div>
    </main>

    <script src="../utils/helpers.js"></script>
    <script src="../utils/thumbnail.js"></script>
    <script src="../utils/metadata.js"></script>
    <script src="../utils/storage.js"></script>
    <script src="../detectors/stream-detector.js"></script>
    <script src="../download/filename-generator.js"></script>
    <script src="../download/quality-selector.js"></script>
    <script src="../download/media-processor.js"></script>
    <script src="../download/download-manager.js"></script>
    <script src="popup.js"></script>
</body>
</html>
