services:
  redis:
    image: redis:7-alpine
    container_name: savezonix_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  savezonix:
    build: .
    container_name: savezonix_app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - Redis__ConnectionString=redis:6379,abortConnect=false,connectTimeout=4000
    volumes:
      - ./Downloads:/app/Downloads
      - ./app_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
