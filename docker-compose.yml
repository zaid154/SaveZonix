services:
  savezonix:
    build: .
    container_name: savezonix_app
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
    volumes:
      - ./Downloads:/app/Downloads
      - ./app_data:/app/data
    restart: unless-stopped
